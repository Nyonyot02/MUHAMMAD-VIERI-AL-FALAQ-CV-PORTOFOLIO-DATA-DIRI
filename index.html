<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Muhammad Vieri Al Falaq - CV, Portfolio, Projects, Skills and Personal Profile">
    <meta name="author" content="Muhammad Vieri Al Falaq">

    <meta property="og:title" content="Muhammad Vieri Al Falaq | Portfolio">
    <meta property="og:description" content="Physics Education • Embedded Systems • ECU Technology">
    <meta property="og:type" content="website">

    <title>Muhammad Vieri Al Falaq | Portfolio</title>

    <style>
        /* =========================================================
           RESET
        ========================================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            scroll-padding-top: 80px;
        }

        body {
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            background: #070b12;
            color: #e8edf5;
            line-height: 1.7;
            overflow-x: hidden;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button {
            font: inherit;
        }

        ::selection {
            background: #00d4ff;
            color: #041018;
        }


        /* =========================================================
           VARIABLES
        ========================================================= */

        :root {
            --bg: #070b12;
            --bg-soft: #0b111b;
            --card: rgba(15, 23, 35, 0.72);
            --card-solid: #101824;

            --text: #e8edf5;
            --muted: #91a0b5;

            --accent: #00d4ff;
            --accent-2: #7c3aed;
            --success: #32d583;

            --border: rgba(255,255,255,0.08);

            --max-width: 1180px;
            --nav-height: 72px;
        }


        /* =========================================================
           BACKGROUND
        ========================================================= */

        .background {
            position: fixed;
            inset: 0;
            z-index: -10;
            pointer-events: none;
            overflow: hidden;
        }

        .grid {
            position: absolute;
            inset: 0;

            background-image:
                linear-gradient(
                    rgba(255,255,255,0.025) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255,255,255,0.025) 1px,
                    transparent 1px
                );

            background-size: 50px 50px;

            mask-image: linear-gradient(
                to bottom,
                black 0%,
                transparent 90%
            );
        }

        .glow {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.13;
        }

        .glow.one {
            background: var(--accent);
            top: -200px;
            left: -150px;
        }

        .glow.two {
            background: var(--accent-2);
            right: -200px;
            top: 35%;
        }


        /* =========================================================
           NAVBAR
        ========================================================= */

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--nav-height);

            z-index: 100;

            background: rgba(7, 11, 18, 0.75);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            border-bottom: 1px solid var(--border);
        }

        .nav-container {
            max-width: var(--max-width);
            height: 100%;
            margin: auto;
            padding: 0 24px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;

            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .brand-mark {
            width: 38px;
            height: 38px;

            display: grid;
            place-items: center;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    var(--accent),
                    var(--accent-2)
                );

            color: white;

            font-weight: 900;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.2);
        }

        .brand span {
            color: var(--text);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 28px;

            list-style: none;
        }

        .nav-links a {
            color: var(--muted);
            font-size: 14px;
            font-weight: 600;

            transition: 0.25s ease;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: var(--accent);
        }

        .menu-toggle {
            display: none;

            width: 42px;
            height: 42px;

            border: 1px solid var(--border);
            border-radius: 10px;

            background: transparent;
            color: var(--text);

            cursor: pointer;
        }


        /* =========================================================
           GENERAL
        ========================================================= */

        .container {
            width: min(var(--max-width), calc(100% - 40px));
            margin: auto;
        }

        section {
            padding: 110px 0;
        }

        .section-header {
            max-width: 720px;
            margin-bottom: 55px;
        }

        .section-label {
            display: inline-flex;
            align-items: center;
            gap: 8px;

            margin-bottom: 12px;

            color: var(--accent);
            font-size: 13px;
            font-weight: 800;

            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .section-label::before {
            content: "";
            width: 28px;
            height: 2px;
            background: var(--accent);
        }

        .section-title {
            font-size: clamp(32px, 5vw, 52px);
            line-height: 1.1;
            letter-spacing: -1.5px;
            margin-bottom: 16px;
        }

        .section-description {
            color: var(--muted);
            font-size: 16px;
        }


        /* =========================================================
           HERO
        ========================================================= */

        .hero {
            min-height: 100vh;
            padding-top: calc(var(--nav-height) + 70px);

            display: flex;
            align-items: center;
        }

        .hero-content {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            align-items: center;
            gap: 70px;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 10px;

            padding: 8px 14px;

            margin-bottom: 25px;

            border: 1px solid var(--border);
            border-radius: 999px;

            background: rgba(255,255,255,0.03);

            color: var(--muted);
            font-size: 13px;
        }

        .status-dot {
            width: 8px;
            height: 8px;

            border-radius: 50%;
            background: var(--success);

            box-shadow: 0 0 12px rgba(50,213,131,0.8);
        }

        .hero h1 {
            font-size: clamp(48px, 7vw, 88px);
            line-height: 0.98;
            letter-spacing: -4px;

            margin-bottom: 25px;
        }

        .hero h1 .gradient {
            background:
                linear-gradient(
                    90deg,
                    var(--accent),
                    #ffffff 45%,
                    #a78bfa
                );

            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .hero-subtitle {
            max-width: 650px;

            color: var(--muted);
            font-size: clamp(17px, 2vw, 20px);

            margin-bottom: 35px;
        }

        .hero-subtitle strong {
            color: var(--text);
        }

        .hero-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;

            padding: 13px 20px;

            border-radius: 11px;

            font-size: 14px;
            font-weight: 800;

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                background 0.25s ease;
        }

        .btn:hover {
            transform: translateY(-3px);
        }

        .btn-primary {
            background: var(--accent);
            color: #031018;

            box-shadow: 0 10px 35px rgba(0, 212, 255, 0.16);
        }

        .btn-primary:hover {
            box-shadow: 0 15px 45px rgba(0, 212, 255, 0.28);
        }

        .btn-secondary {
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.04);
            color: var(--text);
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,0.08);
        }


        /* =========================================================
           HERO VISUAL
        ========================================================= */

        .hero-visual {
            display: flex;
            justify-content: center;
        }

        .profile-orbit {
            position: relative;

            width: min(390px, 80vw);
            aspect-ratio: 1;

            display: grid;
            place-items: center;
        }

        .orbit {
            position: absolute;
            inset: 0;

            border: 1px solid rgba(0,212,255,0.15);
            border-radius: 50%;

            animation: rotate 18s linear infinite;
        }

        .orbit::before {
            content: "";

            position: absolute;

            width: 12px;
            height: 12px;

            top: 14%;
            left: 5%;

            border-radius: 50%;

            background: var(--accent);
            box-shadow: 0 0 20px var(--accent);
        }

        .orbit.two {
            inset: 35px;

            border-color: rgba(124,58,237,0.18);

            animation-duration: 13s;
            animation-direction: reverse;
        }

        .profile-card {
            position: relative;

            width: 245px;
            height: 300px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            border: 1px solid var(--border);
            border-radius: 24px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.07),
                    rgba(255,255,255,0.025)
                );

            backdrop-filter: blur(20px);

            box-shadow:
                0 30px 80px rgba(0,0,0,0.4),
                inset 0 1px rgba(255,255,255,0.06);
        }

        .profile-placeholder {
            width: 115px;
            height: 115px;

            display: grid;
            place-items: center;

            margin-bottom: 20px;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    rgba(0,212,255,0.2),
                    rgba(124,58,237,0.3)
                );

            border: 1px solid rgba(255,255,255,0.1);

            font-size: 44px;
            font-weight: 900;

            color: white;
        }

        .profile-card h3 {
            font-size: 19px;
            margin-bottom: 5px;
        }

        .profile-card p {
            color: var(--muted);
            font-size: 13px;
        }

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }


        /* =========================================================
           STATS
        ========================================================= */

        .stats {
            padding-top: 0;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);

            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
        }

        .stat {
            padding: 28px 20px;

            text-align: center;

            border-right: 1px solid var(--border);
        }

        .stat:last-child {
            border-right: none;
        }

        .stat-number {
            display: block;

            color: var(--accent);

            font-size: 30px;
            font-weight: 900;
        }

        .stat-label {
            color: var(--muted);
            font-size: 13px;
        }


        /* =========================================================
           ABOUT
        ========================================================= */

        .about-grid {
            display: grid;
            grid-template-columns: 0.8fr 1.2fr;
            gap: 70px;
            align-items: start;
        }

        .about-card {
            padding: 30px;

            border: 1px solid var(--border);
            border-radius: 20px;

            background: var(--card);
            backdrop-filter: blur(12px);
        }

        .about-card p {
            color: var(--muted);
            margin-bottom: 18px;
        }

        .about-card p:last-child {
            margin-bottom: 0;
        }

        .info-list {
            list-style: none;
            display: grid;
            gap: 14px;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            gap: 20px;

            padding-bottom: 14px;

            border-bottom: 1px solid var(--border);
        }

        .info-item:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .info-label {
            color: var(--muted);
        }

        .info-value {
            text-align: right;
            font-weight: 700;
        }


        /* =========================================================
           SKILLS
        ========================================================= */

        .skills-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }

        .skill-card {
            padding: 25px;

            border: 1px solid var(--border);
            border-radius: 18px;

            background: var(--card);

            transition:
                transform 0.3s ease,
                border-color 0.3s ease;
        }

        .skill-card:hover {
            transform: translateY(-6px);
            border-color: rgba(0,212,255,0.35);
        }

        .skill-icon {
            width: 46px;
            height: 46px;

            display: grid;
            place-items: center;

            margin-bottom: 17px;

            border-radius: 12px;

            background: rgba(0,212,255,0.08);

            color: var(--accent);

            font-size: 20px;
        }

        .skill-card h3 {
            margin-bottom: 8px;
        }

        .skill-card p {
            color: var(--muted);
            font-size: 14px;
        }


        /* =========================================================
           PROJECTS
        ========================================================= */

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .project-card {
            position: relative;

            padding: 30px;

            min-height: 300px;

            display: flex;
            flex-direction: column;

            border: 1px solid var(--border);
            border-radius: 20px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.05),
                    rgba(255,255,255,0.015)
                );

            overflow: hidden;

            transition:
                transform 0.3s ease,
                border-color 0.3s ease;
        }

        .project-card:hover {
            transform: translateY(-7px);
            border-color: rgba(0,212,255,0.3);
        }

        .project-number {
            color: rgba(255,255,255,0.12);

            font-size: 55px;
            font-weight: 900;

            line-height: 1;
            margin-bottom: 20px;
        }

        .project-card h3 {
            font-size: 23px;
            margin-bottom: 12px;
        }

        .project-card p {
            color: var(--muted);
            font-size: 14px;
            margin-bottom: 22px;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;

            margin-top: auto;
        }

        .tag {
            padding: 5px 9px;

            border: 1px solid var(--border);
            border-radius: 999px;

            color: #b8c3d4;

            font-size: 11px;
            font-weight: 700;
        }


        /* =========================================================
           TIMELINE
        ========================================================= */

        .timeline {
            position: relative;

            max-width: 850px;

            margin: auto;
        }

        .timeline::before {
            content: "";

            position: absolute;

            left: 9px;
            top: 0;
            bottom: 0;

            width: 1px;

            background: var(--border);
        }

        .timeline-item {
            position: relative;

            padding-left: 45px;
            padding-bottom: 45px;
        }

        .timeline-item:last-child {
            padding-bottom: 0;
        }

        .timeline-dot {
            position: absolute;

            left: 3px;
            top: 6px;

            width: 13px;
            height: 13px;

            border-radius: 50%;

            background: var(--accent);

            box-shadow:
                0 0 0 5px rgba(0,212,255,0.08),
                0 0 20px rgba(0,212,255,0.5);
        }

        .timeline-date {
            color: var(--accent);

            font-size: 12px;
            font-weight: 800;

            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .timeline-item h3 {
            margin: 5px 0;
            font-size: 20px;
        }

        .timeline-item p {
            color: var(--muted);
            font-size: 14px;
        }


        /* =========================================================
           CERTIFICATES
        ========================================================= */

        .certificates {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }

        .certificate {
            padding: 25px;

            border: 1px solid var(--border);
            border-radius: 18px;

            background: var(--card);
        }

        .certificate small {
            color: var(--accent);
            font-weight: 800;
        }

        .certificate h3 {
            margin: 8px 0;
        }

        .certificate p {
            color: var(--muted);
            font-size: 14px;
        }


        /* =========================================================
           CONTACT
        ========================================================= */

        .contact-box {
            position: relative;

            padding: 60px 40px;

            text-align: center;

            border: 1px solid var(--border);
            border-radius: 25px;

            background:
                radial-gradient(
                    circle at 50% 0%,
                    rgba(0,212,255,0.1),
                    transparent 50%
                ),
                var(--card);
        }

        .contact-box h2 {
            font-size: clamp(32px, 5vw, 52px);

            margin-bottom: 15px;
        }

        .contact-box p {
            max-width: 600px;

            margin
